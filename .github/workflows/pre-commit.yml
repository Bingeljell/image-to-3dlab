name: pre-commit

# File checks, and the test suite in its own job.
on:
  pull_request:
  push:
    branches: [main, feat/tests-infra]

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: tox-dev/action-pre-commit-uv@v1

  pytest:
    needs: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.7"
      - run: uv sync --frozen
      - run: uv run pytest -q


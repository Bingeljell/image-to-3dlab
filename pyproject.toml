[project]
name = "image-to-3dlab"
version = "0.5.3"
requires-python = ">=3.14,<3.15"
dependencies = [
  "torch>=2.4",
  "torchvision>=0.19",
  "Pillow>=10.3",
  "requests>=2.32",
  "rembg==2.0.86",
  "numpy>=2.3.2",
  "onnxruntime>=1.18",
  "huggingface-hub>=0.24",
  "trimesh>=4.0",
  "scipy>=1.10",
  "opencv-python-headless>=4.8",
  "fast_simplification>=0.1.7",
  "rtree>=1.2",
  "mcp>=2.3,<3",
]

[dependency-groups]
dev = ["pytest>=8.2", "ruff==0.16.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["image_to_3dlab"]

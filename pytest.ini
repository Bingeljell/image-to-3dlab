[pytest]
testpaths = tests
# The project is not installed (package = false). Without this, pytest puts
# tests/ on the path and `import image_to_3dlab` fails.
pythonpath = .
# Two kinds of test cannot run everywhere; tests/conftest.py skips them, with the reason.
markers =
    symlinks: builds its fixture from symlinks; skipped where the OS refuses them (Windows without admin rights or Developer Mode)
    posix: tests POSIX-only behaviour (process groups, signals, exec bits, shell scripts, /bin tools); skipped on Windows

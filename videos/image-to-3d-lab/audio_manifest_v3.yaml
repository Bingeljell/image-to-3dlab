version: 1
project: image-to-3d-lab-v3

defaults:
  sample_rate: 48000
  channels: stereo
  master_format: wav
  exports: [wav, ogg]

assets:
  - id: velocity-bed
    kind: music
    engine: stable-audio-3-medium
    prompt: >
      High-energy breakbeat techno for a fast technical product trailer,
      immediate hard kick on the first beat, 155 BPM, pounding acoustic drums,
      syncopated industrial percussion, distorted analog bass, clipped synth
      stabs, sharp section changes, relentless forward drive, decisive final
      impact, instrumental, no vocals, no speech, no ambient intro, no slow build
    duration: 17
    seeds: [270807]
    variants_to_keep: 1
    license: Stability AI Community License
    params: { steps: 8, cfg: 1.0, apg: 1.0 }
    postprocess:
      - op: crop
        start_seconds: 0
        duration_seconds: 15
      - op: fade
        in_ms: 5
        out_ms: 420
      - op: peak_normalize
        peak_db: -2

  - id: bass-hit
    kind: sfx
    engine: stable-audio-3-small-sfx
    prompt: A sharp bass hit sound effect.
    duration: 1
    seeds: [27101, 27102, 27103]
    variants_to_keep: 1
    license: Stability AI Community License
    params: { steps: 8, cfg: 1.0, apg: 1.0 }
    postprocess:
      - op: peak_normalize
        peak_db: -4

  - id: glitch-cut
    kind: sfx
    engine: stable-audio-3-small-sfx
    prompt: A fast glitch transition sound effect.
    duration: 1
    seeds: [27201, 27202, 27203]
    variants_to_keep: 1
    license: Stability AI Community License
    params: { steps: 8, cfg: 1.0, apg: 1.0 }
    postprocess:
      - op: peak_normalize
        peak_db: -5

  - id: metal-slam
    kind: sfx
    engine: stable-audio-3-small-sfx
    prompt: A heavy metal slam sound effect.
    duration: 1
    seeds: [27301, 27302, 27303]
    variants_to_keep: 1
    license: Stability AI Community License
    params: { steps: 8, cfg: 1.0, apg: 1.0 }
    postprocess:
      - op: peak_normalize
        peak_db: -4
